version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    assignees:
      - 'the3ash'
    commit-message:
      prefix: 'deps'
      prefix-development: 'dev'
      include: 'scope'
    labels:
      - 'dependencies'
    groups:
      # Frontend frameworks
      react:
        patterns: ['react', 'react-dom', '@types/react*']
        update-types: ['minor', 'patch']
      # CSS frameworks
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
        update-types: ['minor', 'patch']
      # TypeScript
      typescript:
        patterns: ['typescript', '@types/*']
        update-types: ['minor', 'patch']
      # Other dependencies
      other:
        patterns: ['*']
        exclude-patterns:
          - 'react*'
          - 'tailwind*'
          - 'typescript*'
        update-types: ['minor', 'patch']
    ignore:
      # These versions must stay aligned with the globally selected Vite+ release.
      - dependency-name: 'vite'
      - dependency-name: 'vite-plus'
      - dependency-name: '@voidzero-dev/vite-plus-core'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    assignees:
      - 'the3ash'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'dependencies'
